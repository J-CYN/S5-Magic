<!DOCTYPE html>
<html>
    <head>
        <title>Season 5 Magic Concept</title>
        <link href="style.css" rel="stylesheet">

    <body>

        <h1>Season 5 Magic</h1>

        <div class="buttons_and_form">
            <div class="button-grid" id="button-grid">
                <button class="circular-button">1_1</button>
                <button class="circular-button">1_2</button>
                <button class="circular-button">1_3</button>
                <button class="circular-button">1_4</button>
                <button class="circular-button">1_5</button>

                <button class="circular-button">2_1</button>
                <button class="circular-button">2_2</button>
                <button class="circular-button">2_3</button>
                <button class="circular-button">2_4</button>
                <button class="circular-button">2_5</button>

                <button class="circular-button">3_1</button>

                <button class="circular-button">5_4</button>

        <form class="form-total">
            <div class="form-group">
                <label for="name-input">Spell Name:</label>
                <input type="text" id="name-input" name="name_full">
            </div>
            <div class="form-group">
                <label for="desc-input">Spell Description:</label>
                <input type="text" id="desc-input" name="description">
            </div>
            <div class="form-group">
                <label for="mana-input">Mana Cost:</label>
                <input type="text" id="mana-input" name="mana_cost">
            </div>
        </form>
        </div>
    </body>
</html>
