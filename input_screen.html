<!DOCTYPE html>
<html>
    <head>
        <title>Laurefell Magic</title>
        <link href="style.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Tangerine&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
    </head>
    <body>
    <header>
        <h1>Laurefell Magic</h1>
    </header>
        <p>A Very Cool Description</p>
        <div class="buttons_and_form">
            <div class="canvas-section">
                <div id="node-canvas"></div>
                <div class="Button-Table">
                    <button class="subbutton" onclick="clearAll()">Clear Spell Table</button>
                    <button class="subbutton">Retrieve Spell</button>
                    <button class="subbutton">Submit Spell</button>
                </div>
                <form class="form-total">
                    <div class="form-group">
                        <label for="name-input">Spell Name:</label>
                        <input type="text" id="name-input" name="name_full">
                    </div>
                    <div class="form-group">
                        <label for="mana-input">Mana Cost:</label>
                        <input type="text" id="mana-input" name="mana_cost">
                    </div>
                </form>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
</html>
