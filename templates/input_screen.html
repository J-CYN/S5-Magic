<!DOCTYPE html>
<html>
    <head>
        <title>Laurefell Magic</title>
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Tangerine&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
    </head>
    <body>
    <header>
        <h1>Laurefell Magic</h1>
    </header>
        <p class="spellInfo" id="fullSpellName">A Very Cool Description</p>
        <p class="spellInfo" id="manaCostTotal">Mana Cost</p>
        <p class="spellInfo" id="nexusCostTotal">Nexus Cost</p>
        <div class="buttons_and_form">
            <div class="canvas-section">
                <div id="node-canvas"></div>
                <div class="Button-Table">
                    <button class="subbutton" onclick="clearAll()">Clear Spell Table</button>
                    <button class="subbutton" onclick="submitSpell()">Submit Spell</button>
                    <button class="subbutton" onclick="retrieveSpell()">Retrieve Spell</button>
                </div>
                <form class="form-total">
                    <div class="form-group">
                        <label for="element-input">Element Name:</label>
                        <input type="text" id="element-input" name="element_name">
                    </div>
                    <div class="form-group">
                        <label for="spell-name-input">Spell Name:</label>
                        <input type="text" id="spell-name-input" name="name_full">
                    </div>
                    <div class="form-group">
                        <label for="mana-spell-input">Spell Mana Cost:</label>
                        <input type="text" id="mana-spell-input" name="mana_spell_cost">
                    </div>
                    <div class="form-group">
                        <label for="modifier-name-input">Modifier Name:</label>
                        <input type="text" id="modifier-name-input" name="modifier_name">
                    </div>
                    <div class="form-group">
                        <label for="mana-modifier-input">Modifier Mana Cost:</label>
                        <input type="text" id="mana-modifier-input" name="mana_modifier_cost">
                    </div>
                </form>
            </div>
        </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
